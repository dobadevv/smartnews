# When true, handles at most one message from articles.fetched, then one from
# articles.crawled, and exits instead of consuming forever. A failed message
# goes to its retry queue as usual. Useful for local testing.
run_once: false

summary:
  enabled: true
  provider: opencode-go
  model: mimo-v2.6-flash
  delay_seconds: 4
content:
  enabled: true
  provider: opencode-go
  model: mimo-v2.6-flash
  delay_seconds: 4

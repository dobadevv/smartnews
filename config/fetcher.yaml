# Time of day the fetcher runs its one daily cycle, in the given timezone.
run_at: "07:00"
timezone: Asia/Ho_Chi_Minh

# When true, the fetcher runs a single cycle immediately and exits instead
# of looping daily at run_at. Useful for a manual/one-off trigger.
run_once: true


[project]
name = "smartnews-redriver"
version = "0.1.0"
description = "Redrives dead-lettered messages and republishes untranslated articles every hour"
requires-python = ">=3.14"
dependencies = [
    "pika>=1.4.4",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "smartnews-common",
    "sqlalchemy>=2.1.1",
]

[project.scripts]
smartnews-redriver = "smartnews_redriver.__main__:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
smartnews-common = { workspace = true }

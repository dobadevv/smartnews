[project]
name = "smartnews-api"
version = "0.1.0"
description = "Serves localized articles to the news reader frontend over HTTP"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "gunicorn>=26.2.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "smartnews-common",
]

[project.scripts]
smartnews-api = "smartnews_api.__main__:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
smartnews-common = { workspace = true }

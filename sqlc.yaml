version: "2"
plugins:
  - name: py
    wasm:
      url: https://downloads.sqlc.dev/plugin/sqlc-gen-python_1.3.0.wasm
      sha256: fbedae96b5ecae2380a70fb5b925fd4bff58a6cfb1f3140375d098fbab7b3a3c
sql:
  - engine: postgresql
    # sqlc skips *.down.sql, so the up migrations alone form the schema.
    schema: db/migrations
    queries: db/queries
    codegen:
      - out: libs/common/src/smartnews_common/db/generated
        plugin: py
        options:
          package: smartnews_common.db.generated
          emit_sync_querier: true
          emit_async_querier: false
          query_parameter_limit: 10

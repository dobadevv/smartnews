name: deploy production

on:
  push:
    tags: ["v*.*.*-stable"]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    strategy:
      fail-fast: false
      matrix:
        service: [fetcher, transformation, notification, crawler, migrate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            UV_SYNC_ARGS=${{ matrix.service == 'migrate' && '--only-group migrate' || format('--no-dev --package smartnews-{0}', matrix.service) }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/smartnews-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/smartnews-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  migrate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Run migrations
        env:
          IMAGE_BASE: ghcr.io/${{ needs.build.outputs.owner }}/smartnews
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -e
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            docker pull ${IMAGE_BASE}-migrate:${IMAGE_TAG}

            docker run --rm \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              ${IMAGE_BASE}-migrate:${IMAGE_TAG} alembic upgrade head
          "

  deploy:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          IMAGE_BASE: ghcr.io/${{ needs.build.outputs.owner }}/smartnews
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -e
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            OLD_FETCHER_IMAGE=\$(docker inspect --format='{{.Image}}' smartnews-fetcher 2>/dev/null || true)
            OLD_CRAWLER_IMAGE=\$(docker inspect --format='{{.Image}}' smartnews-crawler 2>/dev/null || true)
            OLD_TRANSFORMATION_IMAGE=\$(docker inspect --format='{{.Image}}' smartnews-transformation 2>/dev/null || true)
            OLD_NOTIFICATION_IMAGE=\$(docker inspect --format='{{.Image}}' smartnews-notification 2>/dev/null || true)

            docker pull ${IMAGE_BASE}-fetcher:${IMAGE_TAG}
            docker pull ${IMAGE_BASE}-crawler:${IMAGE_TAG}
            docker pull ${IMAGE_BASE}-transformation:${IMAGE_TAG}
            docker pull ${IMAGE_BASE}-notification:${IMAGE_TAG}

            docker rm -f smartnews-fetcher smartnews-crawler smartnews-transformation smartnews-notification 2>/dev/null || true

            docker run -d --name smartnews-fetcher --restart unless-stopped \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              -e RABBITMQ_URL='${{ secrets.RABBITMQ_URL }}' \
              ${IMAGE_BASE}-fetcher:${IMAGE_TAG} smartnews-fetcher

            docker run -d --name smartnews-crawler --restart unless-stopped \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              -e RABBITMQ_URL='${{ secrets.RABBITMQ_URL }}' \
              ${IMAGE_BASE}-crawler:${IMAGE_TAG} smartnews-crawler

            docker run -d --name smartnews-transformation --restart unless-stopped \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              -e RABBITMQ_URL='${{ secrets.RABBITMQ_URL }}' \
              -e GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}' \
              -e GROQ_API_KEY='${{ secrets.GROQ_API_KEY }}' \
              ${IMAGE_BASE}-transformation:${IMAGE_TAG} smartnews-transformation

            docker run -d --name smartnews-notification --restart unless-stopped \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              -e RABBITMQ_URL='${{ secrets.RABBITMQ_URL }}' \
              -e DISCORD_WEBHOOK_URL='${{ secrets.DISCORD_WEBHOOK_URL }}' \
              -e TELEGRAM_BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}' \
              -e TELEGRAM_CHAT_ID='${{ secrets.TELEGRAM_CHAT_ID }}' \
              ${IMAGE_BASE}-notification:${IMAGE_TAG} smartnews-notification

            docker rmi \$OLD_FETCHER_IMAGE \$OLD_CRAWLER_IMAGE \$OLD_TRANSFORMATION_IMAGE \$OLD_NOTIFICATION_IMAGE 2>/dev/null || true
            docker image prune -f
          "

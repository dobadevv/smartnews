[project]
name = "smartnews"
version = "0.1.0"
description = "RSS aggregation pipeline split into fetcher, transformer, notifier, crawler and api services"
readme = "README.md"
authors = [
    { name = "dobadev", email = "doba.fullstack@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/common", "services/fetcher", "services/transformer", "services/notifier", "services/crawler", "services/api"]

[tool.uv.sources]
smartnews-common = { workspace = true }
smartnews-fetcher = { workspace = true }
smartnews-transformer = { workspace = true }
smartnews-notifier = { workspace = true }
smartnews-crawler = { workspace = true }
smartnews-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["libs", "services", "e2e"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "basedpyright>=1.40.2",
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "pytest-httpserver>=1.1.5",
    "responses>=0.26.3",
    "ruff>=0.16.8",
    "smartnews-api",
    "smartnews-common",
    "smartnews-crawler",
    "smartnews-fetcher",
    "smartnews-notifier",
    "smartnews-transformer",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
]
migrate = [
    "alembic>=1.20.0",
    "smartnews-common",
]

[tool.ruff]
extend-exclude = ["libs/common/src/smartnews_common/db/generated"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

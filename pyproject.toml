[project]
name = "smartnews"
version = "0.1.0"
description = "RSS aggregation pipeline split into fetcher, transformation and notification services"
readme = "README.md"
authors = [
    { name = "dobadev", email = "doba.fullstack@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/common", "services/fetcher", "services/transformation", "services/notification"]

[tool.uv.sources]
smartnews-common = { workspace = true }
smartnews-fetcher = { workspace = true }
smartnews-transformation = { workspace = true }
smartnews-notification = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["libs", "services", "e2e"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "pytest-httpserver>=1.1.5",
    "responses>=0.26.3",
    "ruff>=0.16.8",
    "smartnews-common",
    "smartnews-fetcher",
    "smartnews-notification",
    "smartnews-transformation",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
]
migrate = [
    "alembic>=1.20.0",
    "smartnews-common",
]

[tool.ruff]
extend-exclude = ["libs/common/src/smartnews_common/db/generated"]

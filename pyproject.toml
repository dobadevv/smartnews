[project]
name = "smartnews"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dobadev", email = "doba.fullstack@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "feedparser>=6.0.14",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
smartnews = "smartnews:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

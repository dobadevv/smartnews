x-database-url: &database-url postgresql://smartnews:smartnews@postgres:5432/smartnews
x-rabbitmq-url: &rabbitmq-url amqp://guest:guest@rabbitmq:5672/%2F

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartnews
      POSTGRES_PASSWORD: smartnews
      POSTGRES_DB: smartnews
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartnews"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      # Management UI: host-local only. The image's default guest/guest
      # login must never be reachable from outside this machine.
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  migrate:
    build:
      context: .
      args:
        UV_SYNC_ARGS: --only-group migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  fetcher:
    build:
      context: .
      args:
        UV_SYNC_ARGS: --no-dev --package smartnews-fetcher
    command: ["smartnews-fetcher"]
    environment:
      DATABASE_URL: *database-url
      RABBITMQ_URL: *rabbitmq-url
    volumes:
      - ./config:/app/config:ro
    depends_on: &service-dependencies
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  crawler:
    build:
      context: .
      args:
        UV_SYNC_ARGS: --no-dev --package smartnews-crawler
    command: ["smartnews-crawler"]
    environment:
      DATABASE_URL: *database-url
      RABBITMQ_URL: *rabbitmq-url
    volumes:
      - ./config:/app/config:ro
    depends_on: *service-dependencies
    restart: unless-stopped

  transformation:
    build:
      context: .
      args:
        UV_SYNC_ARGS: --no-dev --package smartnews-transformation
    command: ["smartnews-transformation"]
    environment:
      DATABASE_URL: *database-url
      RABBITMQ_URL: *rabbitmq-url
    env_file:
      - path: services/transformation/.env
        required: false
    volumes:
      - ./config:/app/config:ro
    depends_on: *service-dependencies
    restart: unless-stopped

  notification:
    build:
      context: .
      args:
        UV_SYNC_ARGS: --no-dev --package smartnews-notification
    command: ["smartnews-notification"]
    environment:
      DATABASE_URL: *database-url
      RABBITMQ_URL: *rabbitmq-url
    env_file:
      - path: services/notification/.env
        required: false
    volumes:
      - ./config:/app/config:ro
    depends_on: *service-dependencies
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
